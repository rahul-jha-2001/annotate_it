[project]
name = "annotate-it-backend"
version = "0.1.0"
description = "FastAPI backend for Annotate It"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "boto3>=1.28.0",
    "clerk-backend-api>=7.0.0,<8.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "shapely>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_xmllint -p no:ament_lint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_copyright"
