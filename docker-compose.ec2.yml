  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annotate_user} -d ${POSTGRES_DB:-annotate_db}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: annotate-it-backend:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-annotate_user}:${POSTGRES_PASSWORD:-annotate_password}@db:5432/${POSTGRES_DB:-annotate_db}}
      S3_BUCKET: ${S3_BUCKET:-taskglass-annotation-data}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      PLATFORM_ADMIN_CLERK_USER_IDS: ${PLATFORM_ADMIN_CLERK_USER_IDS}
      PRESIGNED_URL_EXPIRY_SECONDS: ${PRESIGNED_URL_EXPIRY_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-}
      RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-120}
      RATE_LIMIT_SESSION_PER_MINUTE: ${RATE_LIMIT_SESSION_PER_MINUTE:-10}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-30}
      RATE_LIMIT_EXPORT_PER_MINUTE: ${RATE_LIMIT_EXPORT_PER_MINUTE:-20}
      LAMBDA_BUNDLE_EXTRACTOR_FUNCTION: ${LAMBDA_BUNDLE_EXTRACTOR_FUNCTION:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
    logging:
      driver: "awslogs"
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: ${AWSLOGS_GROUP:-/taskglass/production}
        awslogs-stream: "backend"
        awslogs-create-group: "true"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "awslogs"
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: ${AWSLOGS_GROUP:-/taskglass/production}
        awslogs-stream: "redis"
        awslogs-create-group: "true"

  export-worker:
    image: annotate-it-backend:latest
    restart: unless-stopped
    command: ["python", "export_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-annotate_user}:${POSTGRES_PASSWORD:-annotate_password}@db:5432/${POSTGRES_DB:-annotate_db}}
      S3_BUCKET: ${S3_BUCKET:-taskglass-annotation-data}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      EXPORT_MAX_ARCHIVE_BYTES: ${EXPORT_MAX_ARCHIVE_BYTES:-10737418240}
      EXPORT_MAX_UNCOMPRESSED_BYTES: ${EXPORT_MAX_UNCOMPRESSED_BYTES:-21474836480}
      EXPORT_RETENTION_SECONDS: ${EXPORT_RETENTION_SECONDS:-604800}
      SKIP_MIGRATIONS: "1"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: ${AWSLOGS_GROUP:-/taskglass/production}
        awslogs-stream: "export-worker"
        awslogs-create-group: "true"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    image: annotate-it-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: ${AWSLOGS_GROUP:-/taskglass/production}
        awslogs-stream: "frontend"
        awslogs-create-group: "true"
    depends_on:
      - backend

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: annotate-it-gateway:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "awslogs"
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: ${AWSLOGS_GROUP:-/taskglass/production}
        awslogs-stream: "gateway"
        awslogs-create-group: "true"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
